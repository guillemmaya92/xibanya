<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>España</title>
<style>
  :root { --accent: #7cc4ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #02030a; }
  body { font-family: "Segoe UI", system-ui, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; color: #eaf2ff; height: 3700vh; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  canvas.grab { cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  .panel {
    position: fixed; left: 50%; top: 50%; z-index: 5;
    transform: translate(-50%, -46%); text-align: center; width: min(90vw, 760px);
    opacity: 0; pointer-events: none; filter: blur(8px);
    transition: opacity .9s ease, transform .9s ease, filter .9s ease;
    text-shadow: 0 2px 30px #000, 0 0 8px #0008;
  }
  .panel.active { opacity: 1; transform: translate(-50%, -50%); filter: blur(0); }
  .panel.top { top: 17vh; }
  .panel.bottom { top: auto; bottom: 11vh; transform: translate(-50%, 20px); }
  .panel.bottom.active { transform: translate(-50%, 0); }
  .panel small { display: block; margin-bottom: .8rem; font-size: .75rem; letter-spacing: .4em; text-transform: uppercase; color: var(--accent); }
  .panel h1 { font-size: clamp(2.4rem, 8vw, 6rem); font-weight: 200; letter-spacing: .08em; }
  .panel p { margin-top: 1rem; font-size: clamp(1rem, 2vw, 1.25rem); opacity: .85; line-height: 1.6; }
  .hint {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 6;
    font-size: .75rem; letter-spacing: .3em; text-transform: uppercase; opacity: .7;
    display: flex; flex-direction: column; align-items: center; gap: .6rem; transition: opacity .4s;
  }
  .hint i { width: 1px; height: 36px; background: linear-gradient(var(--accent), transparent); animation: drop 1.6s infinite; }
  @keyframes drop { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
  /* índice de etapas: panel oscuro translúcido, legible sobre el espacio y sobre los mapas claros */
  .dots {
    position: fixed; right: 1.4rem; top: 50%; transform: translateY(-50%); z-index: 8;
    display: flex; flex-direction: column; gap: .25rem; padding: .7rem;
    background: #02030ab3; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid #ffffff26; border-radius: 16px; box-shadow: 0 8px 30px #0006;
    counter-reset: etapa;
  }
  .dots button {
    all: unset; cursor: pointer; position: relative; counter-increment: etapa;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .55rem .8rem; border-radius: 10px; min-width: 9.5rem;
    font-size: .72rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: #eaf2ffb3; transition: background .3s, color .3s;
  }
  .dots button::before { content: counter(etapa, decimal-leading-zero); font-size: .65rem; letter-spacing: .1em; opacity: .55; font-variant-numeric: tabular-nums; }
  .dots button::after { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; transition: all .3s; }
  .dots button:hover { background: #ffffff14; color: #fff; }
  .dots button.on { background: #7cc4ff26; color: #fff; }
  .dots button.on::before { opacity: 1; color: var(--accent); }
  .dots button.on::after { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .alt { position: fixed; left: 2rem; bottom: 2rem; z-index: 6; font-size: .8rem; letter-spacing: .15em; font-variant-numeric: tabular-nums; padding: .5rem .9rem; border-radius: 999px; background: #02030ab3; backdrop-filter: blur(10px); border: 1px solid #ffffff26; color: #eaf2ffd9; }
  .pin { position: fixed; z-index: 4; left: 0; top: 0; pointer-events: none; opacity: 0; font-size: 1rem; letter-spacing: .35em; text-transform: uppercase; text-shadow: 0 1px 12px #000; will-change: transform, opacity; white-space: nowrap; }
  .pin::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: .8rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px #7cc4ff55, 0 0 24px var(--accent); }
  .lbl { position: fixed; z-index: 4; left: 0; top: 0; pointer-events: none; opacity: 0; font-weight: 700; font-size: clamp(.8rem, 1.6vw, 1.15rem); letter-spacing: .12em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 3px #000c, 0 0 14px #0009; transform: translate(-50%, -50%); will-change: transform, opacity; white-space: nowrap; }
  .legend { position: fixed; left: 2rem; top: 50%; transform: translateY(-50%); z-index: 6; opacity: 0; pointer-events: none; background: #02030a99; backdrop-filter: blur(10px); border: 1px solid #ffffff22; border-radius: 14px; padding: 1.2rem 1.4rem; display: grid; gap: .9rem; }
  .legend header { margin-bottom: .2rem; }
  .legend header span { display: block; font-size: .7rem; letter-spacing: .35em; text-transform: uppercase; color: var(--accent); margin-bottom: .5rem; }
  .legend h2 { font-size: clamp(1.4rem, 2.6vw, 2.1rem); font-weight: 300; letter-spacing: .04em; line-height: 1.15; max-width: 230px; }
  .legend div { display: flex; align-items: center; gap: .8rem; font-size: 1rem; letter-spacing: .08em; }
  .legend i { width: 18px; height: 18px; border-radius: 5px; display: inline-block; }
  .legend small { font-size: .7rem; opacity: .6; max-width: 190px; line-height: 1.4; }
  .legend .ramp { display: grid; gap: .35rem; }
  .legend .ramp div { gap: .7rem; font-size: .85rem; font-variant-numeric: tabular-nums; }
  .legend .ramp i { width: 26px; height: 14px; border-radius: 3px; }
  /* ciudades y monumentos */
  .city { position: fixed; z-index: 4; left: 0; top: 0; pointer-events: none; opacity: 0; will-change: transform, opacity;
    font-size: .95rem; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 1px 10px #000, 0 0 4px #000; }
  .city b { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px #7cc4ff55, 0 0 22px var(--accent); }
  .city b::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); animation: ping 1.8s ease-out infinite; }
  .city span { position: absolute; left: 18px; top: -.7em; }
  .city.left span { left: auto; right: 18px; }
  @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
  .photo { position: fixed; z-index: 7; top: 50%; width: min(34vw, 480px); margin: 0; opacity: 0; pointer-events: none;
    transform: translateY(-50%); background: #02030acc; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid #ffffff26; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px #000a; will-change: opacity, transform; }
  .photo.l { left: 2rem; }
  .photo.r { right: 14rem; }
  .photo img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
  .photo figcaption { padding: 1rem 1.3rem 1.2rem; }
  .photo figcaption span { display: block; font-size: .7rem; letter-spacing: .35em; text-transform: uppercase; color: var(--accent); margin-bottom: .4rem; }
  .photo h2 { font-size: clamp(1.4rem, 2.4vw, 2rem); font-weight: 300; letter-spacing: .03em; }
  .photo p { margin-top: .4rem; font-size: .9rem; line-height: 1.5; opacity: .8; }
  #leader { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; }
  #leader line { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 5; filter: drop-shadow(0 0 4px #000); }
  #leader circle { fill: var(--accent); }
  /* títulos laterales señalados con flecha (Tierra, Europa, España) */
  .panel.side { left: 6vw; top: 50%; width: min(34vw, 440px); text-align: left; transform: translate(0, -46%); }
  .panel.side.active { transform: translate(0, -50%); }
  .panel.side h1 { display: inline-block; font-size: clamp(2rem, 4.6vw, 4.2rem); line-height: 1.05; }
  #arrow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; opacity: 0; overflow: visible; }
  #arrowPath { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; filter: drop-shadow(0 0 6px #000c); }
  #arrowTip { fill: #7cc4ff33; stroke: var(--accent); stroke-width: 2; }
  .panel h1 .big { display: block; font-size: 1.4em; font-weight: 700; line-height: 1.1; }
  /* Europa y España: algo más a la izquierda, más grandes y con más presencia */
  .panel.side.pop { left: 2vw; top: 36%; }
  .panel.bottom.pop h1,
  .panel.side.pop h1 { font-size: clamp(2.8rem, 6.4vw, 6rem); font-weight: 700; letter-spacing: .14em; color: #fff;
    text-shadow: 0 2px 24px #000, 0 0 28px #7cc4ff66, 0 0 2px #000; }
  .photo.tall { width: min(26vw, 380px, calc((80vh - 4rem) * 0.8)); }
  .photo.tall img { aspect-ratio: 4 / 5; }
  /* etiqueta superior con el dato clave (人口密度 / 人均收入) */
  .stat { position: fixed; top: 1.6rem; left: 2rem; z-index: 7; opacity: 0; pointer-events: none;
    transform: translateY(-10px); will-change: opacity, transform; text-align: left;
    padding: .7rem 1.6rem .8rem; border-radius: 16px; background: #02030acc; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid #ffffff26; box-shadow: 0 10px 30px #0008; }
  .stat span { display: block; font-size: clamp(.8rem, 1.1vw, 1rem); letter-spacing: .2em; opacity: .8; }
  .stat b { display: block; margin-top: .15rem; font-size: clamp(1.6rem, 3vw, 2.6rem); font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; color: #fff; }
  #loader { position: fixed; inset: 0; background: #02030a; z-index: 20; display: grid; place-items: center; letter-spacing: .4em; font-size: .8rem; transition: opacity 1s; }
</style>
</head>

<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

// Arrastre horizontal para girar el planeta en la etapa Espacio (el norte se mantiene arriba)
const userQ = new THREE.Quaternion(), dragQ = new THREE.Quaternion();
const AX_X = new THREE.Vector3(1, 0, 0), AX_Y = new THREE.Vector3(0, 1, 0);
let velX = 0, velY = 0, dragging = false, dragX = 0, dragY = 0, dragEnabled = true;
const cv = renderer.domElement;
const rotateBy = (ax, ay) => {
  // giro en ejes de pantalla: horizontal alrededor de Y, vertical alrededor de X
  userQ.premultiply(dragQ.setFromAxisAngle(AX_Y, ax)).premultiply(dragQ.setFromAxisAngle(AX_X, ay)).normalize();
};
cv.addEventListener('pointerdown', e => {
  if (!dragEnabled || e.button > 0) return;
  dragging = true; dragX = e.clientX; dragY = e.clientY; velX = velY = 0;
  cv.setPointerCapture(e.pointerId);
  cv.classList.add('grabbing');
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const ax = (e.clientX - dragX) * 0.006;
  const ay = 0; // solo giro horizontal
  dragX = e.clientX; dragY = e.clientY;
  rotateBy(ax, ay); velX = ax; velY = ay;
});
const endDrag = e => {
  if (!dragging) return;
  dragging = false;
  cv.classList.remove('grabbing');
  if (cv.hasPointerCapture(e.pointerId)) cv.releasePointerCapture(e.pointerId);
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.002, 200);

// Texturas globales
const manager = new THREE.LoadingManager(() => {
  const l = document.getElementById('loader');
  l.style.opacity = 0; setTimeout(() => l.remove(), 1000);
});
const loader = new THREE.TextureLoader(manager);
loader.setCrossOrigin('anonymous');
const base = 'https://unpkg.com/three-globe@2.31.0/example/img/';
const dayMap = loader.load(base + 'earth-blue-marble.jpg');
const bump = loader.load(base + 'earth-topology.png');
const spec = loader.load(base + 'earth-water.png');
dayMap.colorSpace = THREE.SRGBColorSpace;
dayMap.anisotropy = renderer.capabilities.getMaxAnisotropy();

const R = 1;
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(R, 128, 128),
  new THREE.MeshPhongMaterial({
    map: dayMap, bumpMap: bump, bumpScale: 0.015,
    specularMap: spec, specular: new THREE.Color(0x335577), shininess: 18,
  })
);
scene.add(earth);

// Atmósfera
const atmos = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.12, 96, 96),
  new THREE.ShaderMaterial({
    transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,

// Parches de alta resolución con teselas satelitales Esri (Mercator -> equirectangular)
function buildPatch(Z, B, radius, order) {
  const N = 2 ** Z, TS = 256;
  const mercY = lat => (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * N;
  const x0 = Math.floor((B.lonMin + 180) / 360 * N), x1 = Math.floor((B.lonMax + 180) / 360 * N);
  const y0 = Math.floor(mercY(B.latMax)), y1 = Math.floor(mercY(B.latMin));
  const merc = document.createElement('canvas');
  merc.width = (x1 - x0 + 1) * TS; merc.height = (y1 - y0 + 1) * TS;
  const mctx = merc.getContext('2d');
  const jobs = [];
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    jobs.push(new Promise(res => {
      const img = new Image(); img.crossOrigin = 'anonymous';
      img.onload = () => { mctx.drawImage(img, (x - x0) * TS, (y - y0) * TS); res(); };
      img.onerror = () => res();
      img.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${Z}/${y}/${x}`;
    }));
  }
  return Promise.all(jobs).then(() => {
    const W = merc.width, H = Math.round(W * (B.latMax - B.latMin) / (B.lonMax - B.lonMin));
    const eq = document.createElement('canvas'); eq.width = W; eq.height = H;
    const ctx = eq.getContext('2d');
    const sx = ((B.lonMin + 180) / 360 * N - x0) * TS, sw = (B.lonMax - B.lonMin) / 360 * N * TS;
    for (let r = 0; r < H; r++) {
      const lat = B.latMax - (r + 0.5) / H * (B.latMax - B.latMin);
      ctx.drawImage(merc, sx, (mercY(lat) - y0) * TS, sw, 1, 0, r, W, 1);
    }
    // bordes difuminados
    const f = 0.12;
    ctx.globalCompositeOperation = 'destination-in';
    for (const [x2, y2] of [[W, 0], [0, H]]) {
      const g = ctx.createLinearGradient(0, 0, x2, y2);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(f, '#000'); g.addColorStop(1 - f, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    const tex = new THREE.CanvasTexture(eq);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const d = Math.PI / 180;
    const patch = new THREE.Mesh(
      new THREE.SphereGeometry(R * radius, 160, 96,
        (B.lonMin + 180) * d, (B.lonMax - B.lonMin) * d,
        (90 - B.latMax) * d, (B.latMax - B.latMin) * d),
      new THREE.MeshPhongMaterial({ map: tex, transparent: true, depthWrite: false, shininess: 4, specular: 0x111111 })
    );
    patch.renderOrder = order;
    earth.add(patch);
  });
}

let densMat = null;
async function buildDensityMap() {
  const B = MAP_B;
  if (!window.MUNICIPIOS || !window.POBLACION) throw new Error('Faltan municipios.js o poblacion.js');
  const [{ feature, mesh }, { geoArea }, world] = await Promise.all([
    import('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm'),
    import('https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm'),
    fetch('https://unpkg.com/world-atlas@2.0.2/countries-50m.json').then(r => r.json()),
  ]);
  const topo = window.MUNICIPIOS;
  const munis = feature(topo, topo.objects.municipalities).features;
  const countries = feature(world, world.objects.countries).features;

  const W = 4096, H = Math.round(W * (B.latMax - B.latMin) / (B.lonMax - B.lonMin));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const px = ([lon, lat]) => [(lon - B.lonMin) / (B.lonMax - B.lonMin) * W, (B.latMax - lat) / (B.latMax - B.latMin) * H];
  const trace = geom => {
    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.type === 'MultiPolygon' ? geom.coordinates : [];
    ctx.beginPath();
    for (const poly of polys) for (const ring of poly) ring.forEach((p, i) => { const [x, y] = px(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  };
  const traceLines = geom => {
    const lines = geom.type === 'LineString' ? [geom.coordinates] : geom.coordinates;
    ctx.beginPath();
    for (const line of lines) line.forEach((p, i) => { const [x, y] = px(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  };

  ctx.fillStyle = '#a9d6ea'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e6e2d8'; ctx.strokeStyle = '#b9b3a4'; ctx.lineWidth = 3;
  for (const c of countries) { trace(c.geometry); ctx.fill('evenodd'); ctx.stroke(); }

  const EARTH_KM2 = 6371.0088 ** 2;
  for (const m of munis) {
    const pop = window.POBLACION[m.id];
    let a = geoArea(m);
    if (a > 2 * Math.PI) a = 4 * Math.PI - a; // anillo con orientación invertida
    const km2 = a * EARTH_KM2;
    const d = pop != null && km2 > 0 ? pop / km2 : null;
    ctx.fillStyle = d == null ? DENS[0].color : DENS.find(s => d < s.max).color; // sin dato: tramo inferior
    trace(m.geometry); ctx.fill('evenodd');
  }
  // límites municipales finos y comunidades más marcadas
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(60,20,60,0.18)'; ctx.lineWidth = 0.8;
  traceLines(mesh(topo, topo.objects.municipalities, (a, b) => a !== b)); ctx.stroke();

  // bordes difuminados
  const fe = 0.1;
  ctx.globalCompositeOperation = 'destination-in';
  for (const [x2, y2] of [[W, 0], [0, H]]) {
    const g = ctx.createLinearGradient(0, 0, x2, y2);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(fe, '#000'); g.addColorStop(1 - fe, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const dg = Math.PI / 180;
  densMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false });
  const meshObj = new THREE.Mesh(
    new THREE.SphereGeometry(R * 1.0016, 160, 96,
      (B.lonMin + 180) * dg, (B.lonMax - B.lonMin) * dg, (90 - B.latMax) * dg, (B.latMax - B.latMin) * dg),
    densMat);
  meshObj.renderOrder = 4;
  earth.add(meshObj);
}

let rentaMat = null;
async function buildRentaMap() {
  const B = MAP_B;
  if (!window.MUNICIPIOS || !window.RENTA) throw new Error('Faltan municipios.js o renta.js');
  const [{ feature, mesh }, world] = await Promise.all([
    import('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm'),
    fetch('https://unpkg.com/world-atlas@2.0.2/countries-50m.json').then(r => r.json()),
  ]);
  const topo = window.MUNICIPIOS;
  const munis = feature(topo, topo.objects.municipalities).features;
  const countries = feature(world, world.objects.countries).features;

  const W = 4096, H = Math.round(W * (B.latMax - B.latMin) / (B.lonMax - B.lonMin));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const px = ([lon, lat]) => [(lon - B.lonMin) / (B.lonMax - B.lonMin) * W, (B.latMax - lat) / (B.latMax - B.latMin) * H];
  const trace = geom => {
    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.type === 'MultiPolygon' ? geom.coordinates : [];
    ctx.beginPath();
    for (const poly of polys) for (const ring of poly) ring.forEach((p, i) => { const [x, y] = px(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  };
  const traceLines = geom => {
    const lines = geom.type === 'LineString' ? [geom.coordinates] : geom.coordinates;
    ctx.beginPath();
    for (const line of lines) line.forEach((p, i) => { const [x, y] = px(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  };

  ctx.fillStyle = '#a9d6ea'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e6e2d8'; ctx.strokeStyle = '#b9b3a4'; ctx.lineWidth = 3;
  for (const c of countries) { trace(c.geometry); ctx.fill('evenodd'); ctx.stroke(); }

  for (const m of munis) {
    const v = window.RENTA[m.id];
    ctx.fillStyle = v == null ? RENTA_SCALE[0].color : RENTA_SCALE.find(s => v < s.max).color; // sin dato: tramo inferior
    trace(m.geometry); ctx.fill('evenodd');
  }
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(40,30,20,0.18)'; ctx.lineWidth = 0.8;
  traceLines(mesh(topo, topo.objects.municipalities, (a, b) => a !== b)); ctx.stroke();

  const fe = 0.1;
  ctx.globalCompositeOperation = 'destination-in';
  for (const [x2, y2] of [[W, 0], [0, H]]) {
    const g = ctx.createLinearGradient(0, 0, x2, y2);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(fe, '#000'); g.addColorStop(1 - fe, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const dg = Math.PI / 180;
  rentaMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false });
  const meshObj = new THREE.Mesh(
    new THREE.SphereGeometry(R * 1.002, 160, 96,
      (B.lonMin + 180) * dg, (B.lonMax - B.lonMin) * dg, (90 - B.latMax) * dg, (B.latMax - B.latMin) * dg),
    rentaMat);
  meshObj.renderOrder = 5;
  earth.add(meshObj);
}
buildRentaMap().catch(err => console.warn('No se pudo cargar el mapa de renta', err));
// Geometría
function latLonToVec(lat, lon) {
  const phi = (lon + 180) * Math.PI / 180, theta = (90 - lat) * Math.PI / 180;
  return new THREE.Vector3(-Math.cos(phi) * Math.sin(theta), Math.cos(theta), Math.sin(phi) * Math.sin(theta));
}
// Orientación del globo para que (lat, lon) mire a la cámara con el norte arriba
function quatFor(lat, lon) {
  const v = latLonToVec(lat, lon);
  const q = new THREE.Quaternion().setFromUnitVectors(v, new THREE.Vector3(0, 0, 1));
  const n = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
  const roll = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.atan2(-n.x, n.y));
  return q.premultiply(roll);
}

stages.push(MAP_VIEW); // 18 densidad de población
stages.push(MAP_VIEW); // 19 renta por persona
const LAST = stages.length - 1;
const legend2 = document.getElementById('legend2');

// renta media nacional: INE, Atlas de Distribución de Renta de los Hogares 2024 (15.948 € por persona)
if (window.POBLACION) {

const legend3 = document.getElementById('legend3');
const cities = [
  { el: document.getElementById('cityBcn'), photo: document.getElementById('photoBcn'), k: 4, side: 'l' },
  { el: document.getElementById('cityGra'), photo: document.getElementById('photoGra'), k: 5, side: 'r' },

].map(c => ({ ...c, v: latLonToVec(+c.el.dataset.lat, +c.el.dataset.lon).multiplyScalar(1.002) }));
const leaderSvg = document.getElementById('leader');
const leaderLine = document.getElementById('leaderLine');
const leaderDot = document.getElementById('leaderDot');
// flecha desde el título hasta lo que se nombra: 0 Tierra, 1 Europa, 2 España
const arrowSvg = document.getElementById('arrow');
const arrowPath = document.getElementById('arrowPath');
const arrowTip = document.getElementById('arrowTip');
const arrowTargets = [null, latLonToVec(50, 10).multiplyScalar(1.002), latLonToVec(40.2, -3.7).multiplyScalar(1.002)];
const arrowV = new THREE.Vector3();
// visibilidad de una etapa k: aparece al llegar y se va al salir
const stageVis = (s, k) => smoother((s - (k - 0.55)) / 0.35) * (1 - smoother((s - (k + 0.2)) / 0.35));
const lbls = [...document.querySelectorAll('.lbl')].map(el => ({ el, v: latLonToVec(+el.dataset.lat, +el.dataset.lon).multiplyScalar(1.003) }));
const legend = document.getElementById('legend');

// Scroll
let target = 0, progress = 0;
const panels = [...document.querySelectorAll('.panel')];
const dots = [...document.querySelectorAll('#dots button')];
const altEl = document.getElementById('alt');
const hint = document.getElementById('hint');
const pinEl = document.getElementById('pin');
const maxScroll = () => document.documentElement.scrollHeight - innerHeight;
const readScroll = () => { target = Math.min(Math.max(scrollY / maxScroll(), 0), 1); };
addEventListener('scroll', readScroll, { passive: true });
readScroll();

const goTo = i => scrollTo({ top: Math.min(Math.max(i, 0), LAST) / LAST * maxScroll(), behavior: 'smooth' });
dots.forEach(b => b.addEventListener('click', () => goTo(+b.dataset.i)));
addEventListener('keydown', e => {
  const cur = Math.round(target * LAST);
  if (['ArrowDown', 'PageDown', ' ', 'ArrowRight'].includes(e.key)) { e.preventDefault(); goTo(cur + 1); }
  if (['ArrowUp', 'PageUp', 'ArrowLeft'].includes(e.key)) { e.preventDefault(); goTo(cur - 1); }
  if (e.key === 'Home') goTo(0);
  if (e.key === 'End') goTo(LAST);
});

const smoother = t => { t = Math.min(Math.max(t, 0), 1); return t * t * t * (t * (t * 6 - 15) + 10); };
const lerp = (a, b, t) => a + (b - a) * t;
const tmp = new THREE.Vector3();
const qa = new THREE.Quaternion(), yAxis = new THREE.Vector3(0, 1, 0);
const clock = new THREE.Clock();

function frame() {
  const t = clock.getElapsedTime();
  progress += (target - progress) * 0.05;

  // posición entre etapas, con pausa al llegar a cada una
  const s = progress * LAST;
  const i = Math.min(Math.floor(s), LAST - 1);
  const f = smoother((s - i - 0.18) / 0.64);
  const A = stages[i], Bn = stages[i + 1];

  const dist = Math.exp(lerp(Math.log(A.dist), Math.log(Bn.dist), f));
  const fov = lerp(A.fov, Bn.fov, f);
  const tilt = lerp(A.tilt, Bn.tilt, f);
  camera.position.set(0, -Math.sin(tilt) * dist, Math.cos(tilt) * dist);
  camera.lookAt(0, 0, R * smoother((6.2 - dist) / 5));
  camera.fov = fov; camera.updateProjectionMatrix();

  // orientación del globo
  // inercia al soltar y arrastre solo en la etapa Espacio
  if (!dragging && (Math.abs(velX) + Math.abs(velY) > 1e-5)) { rotateBy(velX, velY); velX *= 0.94; velY *= 0.94; }
  dragEnabled = s < 0.35;
  cv.classList.toggle('grab', dragEnabled && !dragging);
  if (!dragEnabled && dragging) { dragging = false; cv.classList.remove('grabbing'); }
  const spin = qa.clone().setFromAxisAngle(yAxis, 0.4 + t * 0.06).premultiply(userQ);
  const qA = A.q || spin;
  earth.quaternion.copy(qA).slerp(Bn.q, f);

  stars.rotation.y = t * 0.002;
  const skyA = 1 - 0.5 * smoother(s / LAST);
  starMat.uniforms.uTime.value = t;
  starMat.uniforms.uOpacity.value = skyA;
  for (const n of nebulae) n.m.opacity = n.base * skyA;
  // estrellas fugaces solo mientras se ve el espacio (Espacio y Europa)
  const dtM = Math.min(Math.max(t - (frame.lastT ?? t), 0), 0.05); frame.lastT = t;
  updateMeteors(t, dtM, 1 - smoother((s - 0.8) / 0.6));

  // marcador de Madrid: aparece en la última etapa
  // transición imagen real -> mapa pintado
  const mapsOn = 1; // Renta es la última etapa: los mapas pintados se quedan
  const mapA = smoother((s - 16.15) / 0.6) * mapsOn;
  if (mapMat) mapMat.opacity = mapA;
  if (globeMat) globeMat.opacity = mapA;
  const densA = smoother((s - 17.15) / 0.6);
  if (densMat) densMat.opacity = densA * mapsOn;
  const rentaA = smoother((s - 18.15) / 0.6);
  if (rentaMat) rentaMat.opacity = rentaA * mapsOn;
  const pa = smoother(s - 2.15) * (1 - smoother((s - 3.05) / 0.35)); // se oculta al pasar a Lugares
  const pulse = (t * 0.8) % 1;
  const rs = 0.014 * (0.5 + pulse);
  ring.scale.setScalar(Math.max(rs, 1e-4));
  ring.material.opacity = pa * (1 - pulse);
  earth.updateMatrixWorld();
  tmp.copy(ring.position).applyMatrix4(earth.matrixWorld).project(camera);
  pinEl.style.opacity = pa;
  pinEl.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * innerWidth + 18}px, ${(-tmp.y * 0.5 + 0.5) * innerHeight - 10}px)`;

  // etiquetas de idiomas
  const la = smoother((s - 16.65) / 0.3) * (1 - smoother((s - 17.05) / 0.3));
  for (const l of lbls) {
    tmp.copy(l.v).applyMatrix4(earth.matrixWorld).project(camera);
    l.el.style.opacity = la;
    l.el.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * innerWidth}px, ${(-tmp.y * 0.5 + 0.5) * innerHeight}px) translate(-50%, -50%)`;
  }
  legend.style.opacity = la;
  legend2.style.opacity = smoother((s - 17.6) / 0.3) * (1 - smoother((s - 18.05) / 0.3));
  legend3.style.opacity = smoother((s - 18.6) / 0.3);
  const popA = smoother((s - 17.6) / 0.3) * (1 - smoother((s - 18.05) / 0.3));
  const incA = smoother((s - 18.6) / 0.3);
  statPop.style.opacity = popA; statPop.style.transform = `translateY(${(1 - popA) * -10}px)`;
  statInc.style.opacity = incA; statInc.style.transform = `translateY(${(1 - incA) * -10}px)`;

  // ciudades con monumento
  let leaderA = 0;
  for (const c of cities) {
    const a = stageVis(s, c.k);
    tmp.copy(c.v).applyMatrix4(earth.matrixWorld).project(camera);
    const x = (tmp.x * 0.5 + 0.5) * innerWidth, y = (-tmp.y * 0.5 + 0.5) * innerHeight;
    c.el.style.opacity = a;
    c.el.style.transform = `translate(${x}px, ${y}px)`;
    c.photo.style.opacity = a;
    c.photo.style.transform = `translateY(calc(-50% + ${(1 - a) * 24}px))`;
    if (a > leaderA) {
      leaderA = a;
      const r = c.photo.getBoundingClientRect();
      const px2 = c.side === 'l' ? r.right : r.left, py2 = r.top + r.height * 0.35;
      leaderLine.setAttribute('x1', x); leaderLine.setAttribute('y1', y);
      leaderLine.setAttribute('x2', px2); leaderLine.setAttribute('y2', py2);
      leaderDot.setAttribute('cx', px2); leaderDot.setAttribute('cy', py2);
    }
  }
  leaderSvg.style.opacity = leaderA;

  // flecha del título (etapas 0-2)
  const ak = Math.round(s);
  const arrowA = ak <= 2 ? 1 - smoother((Math.abs(s - ak) - 0.12) / 0.16) : 0;
  arrowSvg.style.opacity = arrowA;
  if (arrowA > 0.001) {
    const h = panels[ak].querySelector('h1').getBoundingClientRect();
    const sx = h.right + 18, sy = h.top + h.height * 0.55;
    const ctrl = (ex, ey) => [(sx + ex) / 2, Math.min(sy, ey) - Math.max(50, Math.abs(ex - sx) * 0.25)];
    let ex, ey, cx, cy, gap;
    if (arrowTargets[ak]) {
      arrowV.copy(arrowTargets[ak]).applyMatrix4(earth.matrixWorld).project(camera);
      ex = (arrowV.x * 0.5 + 0.5) * innerWidth; ey = (-arrowV.y * 0.5 + 0.5) * innerHeight;
      [cx, cy] = ctrl(ex, ey);
      gap = 12; // deja sitio al círculo del objetivo
    } else {
      // Tierra: la punta toca el horizonte (silueta) del globo
      arrowV.set(0, 0, 0).project(camera);
      const gx = (arrowV.x * 0.5 + 0.5) * innerWidth, gy = (-arrowV.y * 0.5 + 0.5) * innerHeight;
      const alpha = Math.asin(Math.min(R / camera.position.length(), 1));
      const rad = Math.tan(alpha) / Math.tan(camera.fov * Math.PI / 360) * innerHeight / 2;
      // punto de la silueta en la dirección por la que llega la curva (dos iteraciones bastan)
      ex = gx - rad; ey = gy;
      for (let it = 0; it < 3; it++) {
        [cx, cy] = ctrl(ex, ey);
        const vx = cx - gx, vy = cy - gy, vl = Math.hypot(vx, vy) || 1;
        ex = gx + vx / vl * rad; ey = gy + vy / vl * rad;
      }
      [cx, cy] = ctrl(ex, ey);
      gap = 4.5; // la punta de la flecha sobresale ~4,5 px del final del trazo
    }
    const dx = ex - cx, dy = ey - cy, dl = Math.hypot(dx, dy) || 1;
    const tx = ex - dx / dl * gap, ty = ey - dy / dl * gap;
    arrowTip.style.display = arrowTargets[ak] ? '' : 'none';
    arrowPath.setAttribute('d', `M${sx},${sy} Q${cx},${cy} ${tx},${ty}`);
    // efecto de trazo: la flecha se dibuja al aparecer
    const len = arrowPath.getTotalLength();
    arrowPath.style.strokeDasharray = len;
    arrowPath.style.strokeDashoffset = len * (1 - arrowA);
    arrowTip.setAttribute('cx', ex); arrowTip.setAttribute('cy', ey);
  }

  // UI
  altEl.textContent = Math.round((dist - R) * 6371).toLocaleString('zh-CN');
  hint.style.opacity = progress < 0.02 ? 0.7 : 0;
  panels.forEach((p, k) => p.classList.toggle('active', Math.abs(s - k) < 0.3));
  dots.forEach(d => { const a = +d.dataset.i, b = +(d.dataset.to ?? a); d.classList.toggle('on', s >= a - 0.5 && s < b + 0.5); });

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  starMat.uniforms.uPR.value = renderer.getPixelRatio();
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});
